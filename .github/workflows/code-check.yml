name: Validate analysis source
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile advanced_pressure_rank.py check_sensitivity.py aggregate_robust_rank.py
      - run: python -m unittest discover -s tests -v
